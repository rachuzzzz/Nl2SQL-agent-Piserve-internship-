<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OctaAI — Preparing your workspace</title>
<link rel="stylesheet" href="theme.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans);
    position: relative; overflow: hidden; }

  .screen { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 1500px; height: 940px;
    transform-origin: center center;
    border: 1px solid var(--border); border-radius: 28px; overflow: hidden;
    background: radial-gradient(130% 120% at 72% 30%, var(--bg-grad-a), var(--bg-grad-b) 62%);
    box-shadow: var(--shadow-lg);
    display: grid; grid-template-columns: 1.02fr 1.18fr; }

  /* corner dot grids */
  .dotgrid { position: absolute; width: 92px; height: 64px; opacity: .5;
    background-image: radial-gradient(circle, var(--border-2) 2px, transparent 2.4px);
    background-size: 16px 16px; pointer-events: none; }
  .dotgrid.tr { top: 40px; right: 48px; }
  .dotgrid.bl { bottom: 46px; left: 48px; width: 64px; height: 48px; }
  .dotgrid.br { bottom: 44px; right: 48px; }

  /* ---------------- LEFT ---------------- */
  .left { position: relative; z-index: 2; padding: 72px; display: flex;
    flex-direction: column; }
  .left > * { flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo .mark { width: 46px; height: 46px; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--accent) 30%, transparent)); }
  .logo b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .logo b .ai { color: var(--text); }

  .headline { margin: 56px 0 0; font-size: 56px;
    font-weight: 800; line-height: 1.1; letter-spacing: -.035em; max-width: 13ch; text-wrap: balance; }
  .headline .hl { color: var(--accent); }
  .sub { margin: 30px 0 0; font-size: 20px; color: var(--text-2); font-weight: 500; }

  .features { display: flex; gap: 56px; margin-top: 52px; }
  .feature { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .feature .fic { width: 58px; height: 58px; border-radius: 16px; background: var(--accent-soft);
    border: 1px solid var(--accent-soft-border); display: grid; place-items: center; color: var(--accent); }
  .feature .fic svg { width: 26px; height: 26px; }
  .feature span { font-size: 14.5px; font-weight: 600; color: var(--text-2); }

  .loadfoot { margin-top: auto; display: flex; align-items: center; gap: 18px; padding-top: 40px; }
  .robot { width: 64px; height: 64px; flex: none; animation: bob 3s ease-in-out infinite; }
  .robot .eye { transform-box: fill-box; transform-origin: center; animation: blink 3.4s infinite; }
  .loadfoot .meta { flex: 1; max-width: 380px; }
  .loadfoot .status { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
  .loadfoot .status .txt { animation: om-text-in .4s var(--ease); display: inline-block; }
  .bar { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 4%; border-radius: 999px;
    background: linear-gradient(90deg, var(--blue-700), var(--blue-400));
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: width .4s var(--ease); }

  /* ---------------- RIGHT: animated OctaAI logo ---------------- */
  .right { position: relative; display: grid; place-items: center; }
  .logoStage { position: relative; width: 600px; height: 600px; display: grid; place-items: center; }

  /* glow halo */
  .halo { position: absolute; width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), transparent 66%);
    filter: blur(34px); animation: haloPulse 2.4s ease-in-out infinite; }

  /* radial synthesizer equalizer (bars driven by JS) */
  .eq { position: absolute; inset: 0; z-index: 1; }
  .eq .bar { position: absolute; left: 50%; bottom: 50%; width: 5px; margin-left: -2.5px;
    height: 30px; border-radius: 3px; transform-origin: 50% 100%;
    background: linear-gradient(to top, color-mix(in srgb, var(--accent) 0%, transparent),
      var(--blue-400) 40%, var(--accent)); will-change: height, transform; }

  /* morphing blue blob */
  .blob { position: relative; z-index: 2; width: 340px; height: 340px;
    background: radial-gradient(130% 130% at 36% 28%, var(--blue-400), var(--blue-600) 56%, var(--blue-700));
    border-radius: 47% 53% 46% 54% / 52% 47% 53% 48%;
    box-shadow: 0 34px 90px color-mix(in srgb, var(--accent) 42%, transparent),
      inset 0 -22px 64px color-mix(in srgb, var(--blue-700) 60%, transparent);
    animation: blobMorph 7s ease-in-out infinite, blobThrob 1.35s ease-in-out infinite; }

  /* hand-drawn rings + tapering tail dots */
  .rings { position: absolute; inset: 0; z-index: 3; overflow: visible; pointer-events: none; }
  .ring-solid { animation: spin 26s linear infinite; transform-box: view-box; transform-origin: 300px 300px; }
  .ring-dot { animation: spin 19s linear infinite reverse; transform-box: view-box; transform-origin: 300px 300px; }
  .tail-dot { animation: tailPulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  /* keyframes */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
  @keyframes flowDown { 0% { top: -8px; opacity: 0; } 18% { opacity: 1; } 82% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
  @keyframes sonar { 0% { transform: scale(.85); opacity: .5; } 100% { transform: scale(2.3); opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes lineIn { to { opacity: 1; transform: translateX(0); } }
  @keyframes twinkle { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes caret { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes grow { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  @keyframes blobMorph {
    0%,100% { border-radius: 47% 53% 46% 54% / 52% 47% 53% 48%; }
    33%     { border-radius: 55% 45% 58% 42% / 46% 56% 44% 54%; }
    66%     { border-radius: 43% 57% 48% 52% / 57% 43% 60% 40%; }
  }
  @keyframes blobThrob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes haloPulse { 0%,100% { transform: scale(.9); opacity: .5; } 50% { transform: scale(1.1); opacity: .85; } }
  @keyframes tailPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .robot, .blob, .halo, .ring-solid, .ring-dot, .tail-dot { animation: none; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="dotgrid tr"></div>
  <div class="dotgrid bl"></div>
  <div class="dotgrid br"></div>

  <!-- ============ LEFT ============ -->
  <div class="left">
    <div class="logo">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="markG" x1="14" y1="86" x2="86" y2="14" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--blue-700)" />
            <stop offset="1" stop-color="var(--blue-400)" />
          </linearGradient>
        </defs>
        <polygon points="86.9,65.3 65.3,86.9 34.7,86.9 13.1,65.3 13.1,34.7 34.7,13.1 65.3,13.1 86.9,34.7"
          fill="none" stroke="url(#markG)" stroke-width="15" stroke-linejoin="round" />
      </svg>
      <b>Octa<span class="ai">AI</span></b>
    </div>

    <h1 class="headline">Turning Questions into Insights <span class="hl">with AI</span></h1>
    <p class="sub">Ask in plain English. Get accurate SQL.</p>

    <div class="features">
      <div class="feature">
        <div class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.9-5.4A8.38 8.38 0 0 1 4 12a8.5 8.5 0 0 1 8.5-8.5A8.38 8.38 0 0 1 21 11.5z"/><path d="M9 11h.01M12.5 11h.01M16 11h.01"/></svg></div>
        <span>Natural Language</span>
      </div>
      <div class="feature">
        <div class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg></div>
        <span>SQL Generation</span>
      </div>
      <div class="feature">
        <div class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
        <span>Instant Results</span>
      </div>
    </div>

    <div class="loadfoot">
      <svg class="robot" viewBox="0 0 64 64" aria-hidden="true">
        <line x1="32" y1="6" x2="32" y2="15" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="32" cy="5" r="3.2" fill="var(--accent)"/>
        <rect x="5" y="27" width="6" height="14" rx="3" fill="var(--blue-300)"/>
        <rect x="53" y="27" width="6" height="14" rx="3" fill="var(--blue-300)"/>
        <rect x="12" y="15" width="40" height="38" rx="14" fill="#fff" stroke="var(--blue-200)" stroke-width="2"/>
        <rect x="18" y="23" width="28" height="20" rx="9" fill="#141A36"/>
        <circle class="eye" cx="27" cy="33" r="3.4" fill="#7FE3FF"/>
        <circle class="eye" cx="37" cy="33" r="3.4" fill="#7FE3FF"/>
      </svg>
      <div class="meta">
        <div class="status"><span class="txt" id="statusTxt">Preparing your workspace…</span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </div>
  </div>

  <!-- ============ RIGHT: animated OctaAI logo ============ -->
  <div class="right">
    <div class="logoStage" aria-hidden="true">
      <div class="halo"></div>
      <div class="eq" id="eq"></div>
      <div class="blob"></div>
      <svg class="rings" viewBox="0 0 600 600">
        <g class="ring-solid">
          <circle cx="300" cy="300" r="232" fill="none" stroke="#131A33" stroke-width="4.5"
            stroke-linecap="round" stroke-dasharray="1276 182" transform="rotate(128 300 300)"/>
        </g>
        <g class="ring-dot">
          <circle cx="300" cy="300" r="210" fill="none" stroke="#131A33" stroke-width="3.4"
            stroke-linecap="round" stroke-dasharray="0.5 13.5"/>
        </g>
        <g class="tail">
          <circle class="tail-dot" style="animation-delay:0s"   cx="118" cy="360" r="4"   fill="#131A33"/>
          <circle class="tail-dot" style="animation-delay:.12s" cx="107" cy="396" r="5.4" fill="#131A33"/>
          <circle class="tail-dot" style="animation-delay:.24s" cx="110" cy="432" r="7"   fill="#1B43FF"/>
          <circle class="tail-dot" style="animation-delay:.36s" cx="123" cy="467" r="6"   fill="#131A33"/>
          <circle class="tail-dot" style="animation-delay:.48s" cx="143" cy="497" r="4.6" fill="#131A33"/>
          <circle class="tail-dot" style="animation-delay:.60s" cx="168" cy="520" r="3.6" fill="#1B43FF"/>
          <circle class="tail-dot" style="animation-delay:.72s" cx="196" cy="535" r="2.8" fill="#131A33"/>
          <circle class="tail-dot" style="animation-delay:.84s" cx="223" cy="544" r="2.2" fill="#131A33"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
  // build the radial synthesizer equalizer and drive it with a flowing wave
  (function () {
    var eq = document.getElementById('eq');
    var N = 76, R = 172, bars = [];
    for (var i = 0; i < N; i++) {
      var b = document.createElement('span');
      b.className = 'bar';
      b.style.transform = 'rotate(' + (i / N * 360) + 'deg) translateY(-' + R + 'px)';
      eq.appendChild(b);
      bars.push(b);
    }
    function frame(now) {
      var t = now / 1000;
      for (var i = 0; i < N; i++) {
        var v = 0.5 + 0.5 * Math.sin(t * 2.1 + i * 0.46);
        var w = 0.5 + 0.5 * Math.sin(t * 3.6 - i * 0.83);
        bars[i].style.height = (13 + v * 30 + w * 20).toFixed(1) + 'px';
        bars[i].style.opacity = (0.34 + 0.5 * v).toFixed(2);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  // status messages + progress, then advance to the workspace
  var STAGES = [
    "Preparing your workspace…",
    "Connecting to ehs_prod…",
    "Generating SQL…",
    "Validating the query…",
    "Almost ready…"
  ];
  var statusEl = document.getElementById('statusTxt');
  var bar = document.getElementById('barFill');
  var DURATION = 7600;          // total before redirect
  var NEXT_PAGE = 'OptimaX.html';
  var start = Date.now();

  // scale the fixed-size canvas to fit any viewport (letterboxed)
  var screenEl = document.querySelector('.screen');
  function fit() {
    var k = Math.min(window.innerWidth / 1500, window.innerHeight / 940) * 0.98;
    screenEl.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  var tick = setInterval(function () {
    var p = Math.min(1, (Date.now() - start) / DURATION);
    bar.style.width = (4 + p * 96).toFixed(1) + '%';
    var idx = Math.min(STAGES.length - 1, Math.floor(p * STAGES.length));
    if (statusEl.textContent !== STAGES[idx]) {
      statusEl.style.animation = 'none'; void statusEl.offsetWidth; statusEl.style.animation = '';
      statusEl.textContent = STAGES[idx];
    }
    if (p >= 1) {
      clearInterval(tick);
      document.querySelector('.screen').style.transition = 'opacity .5s var(--ease)';
      document.querySelector('.screen').style.opacity = '0';
      setTimeout(function () { window.location.href = NEXT_PAGE; }, 520);
    }
  }, 80);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1B43FF"/>
    <polygon points="80,62 62,80 38,80 20,62 20,38 38,20 62,20 80,38" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round"/>
  </svg>
</template>

</body>
</html>
